[workspace]
members = ["cargo:."]

# Config for `dist` (https://opensource.axo.dev/cargo-dist/).
#
# `.github/workflows/release.yml` is NOT in this repository: it is
# generated from this file. Run `dist init` once after generating the
# project, then `just fmt` (dist rewrites this file in its own style), and
# commit both. Shipping a pre-generated copy would pin you to whatever
# `dist` version the template was built against and be overwritten on your
# first `dist init` anyway. `dist plan`, in the release, refuses a
# release.yml that is not what dist writes -- so it is dist's alone, and
# Dependabot leaves it out. `nix develop` has dist at this version
# (nixpkgs'): the flake's `pins` check holds the two equal, and `just
# pins-update` moves this (and release.yml) once the lock moves dist.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
install-updater = false
auto-includes = true
publish-jobs = ["./publish-crates"]
# the crates published to crates.io once the binaries are built and the GitHub
# release made (.github/workflows/publish-crates.yml, the job above: `dist
# init` rewrites its comment), given what Trusted Publishing needs alone -- a
# custom publish job's default adds `packages: write`
github-custom-job-permissions = { "publish-crates" = { contents = "read", id-token = "write" } }
