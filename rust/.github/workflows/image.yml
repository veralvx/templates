# A release tag (`just release`'s v<version>) publishes the binary's OCI image to GHCR, as
# ghcr.io/<owner>/<repository>: the flake's `image` built on each Linux architecture, started
# once, pushed per architecture, then joined under one multi-architecture tag, <version> (and
# `latest` while it is the highest release). The job's token pushes: no secret stored. A first
# push is private (GHCR's default): make the package public in its settings once. Docker Hub
# too, the same tags, once vars.DOCKERHUB_USERNAME and secrets.DOCKERHUB_TOKEN (an access
# token that writes) are set: as vars.DOCKERHUB_REPOSITORY, else <username>/<repository>. A
# Docker Hub failure holds GHCR's release back too; a re-run, once fixed, completes both. The
# per-architecture tags (<version>-amd64, <version>-arm64) stay, the multi-architecture tag's
# parts. Run by hand (workflow_dispatch) on a branch, it builds and starts the image on both,
# pushing nothing: a rehearsal before the first release; on a tag, it publishes that release again.
name: Image

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and start (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: read
      packages: write
    outputs:
      description: ${{ steps.build.outputs.description }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Build and start
        id: build
        run: |
          set -euo pipefail
          version="$(nix eval --raw .#image.imageTag)"
          # a tag's version is the one Cargo.toml declares at its commit, the image's tag
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::$GITHUB_REF_NAME, but Cargo.toml declares $version" >&2
            exit 1
          fi
          # streamed into docker: no compressed copy of the closure in the store
          stream="$(nix build --no-link --print-out-paths .#image.stream)"
          "$stream" | docker load
          loaded="$(nix eval --raw .#image.imageName):$version"
          # it starts, as its user: detached, so what it then does -- exit, complain of no
          # arguments, serve forever -- decides nothing; docker refuses to start an entrypoint
          # missing or not executable there
          container="$(docker run --detach --pull never "$loaded")"
          docker rm --force "$container" > /dev/null
          echo "description=$(nix eval --raw .#default.meta.description)" >> "$GITHUB_OUTPUT"

      - name: Push
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          # Docker Hub too, when both are set (.github/image-registries.sh): an unset variable or
          # secret is empty, and no `if:` can read a secret. The username is a variable, as in
          # Docker's guide: a secret would be masked wherever it appears, GHCR's paths included
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          repositories="$(.github/image-registries.sh)"
          version="${GITHUB_REF_NAME#v}"
          loaded="$(nix eval --raw .#image.imageName):$version"
          # the list on its own descriptor: no command in the loop can read it away
          while read -r repository <&3; do
            docker tag "$loaded" "$repository:$version-$ARCH"
            docker push "$repository:$version-$ARCH"
          done 3<<< "$repositories"

  publish:
    name: Multi-architecture tag
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        # every tag, to tell whether this one is the highest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Join the architectures
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DESCRIPTION: ${{ needs.build.outputs.description }}
        run: |
          set -euo pipefail
          repositories="$(.github/image-registries.sh)"
          version="${GITHUB_REF_NAME#v}"
          # `latest`: the highest final release (SemVer: no pre-release, no build metadata), so a
          # patch to an older line leaves it where it is
          highest="$(git tag --list 'v[0-9]*' | sed 's/^v//' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
          # each repository's index from its own pushes: imagetools create's sources must be in
          # the registry it writes to (its docs). The description is the index's annotation, as
          # GHCR reads it for a multi-architecture image
          while read -r repository <&3; do
            tags=(--tag "$repository:$version")
            if [[ $version == "$highest" ]]; then tags+=(--tag "$repository:latest"); fi
            docker buildx imagetools create "${tags[@]}" \
              --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
              "$repository:$version-amd64" "$repository:$version-arm64"
          done 3<<< "$repositories"
