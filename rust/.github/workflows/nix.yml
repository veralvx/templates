name: Nix

# The flake's formatter (`nix fmt`), then its checks (flake.nix): clippy,
# rustfmt, rustdoc and the tests (and the image, with one), the format, the
# shell, the workflows and, with dist, its version (`pins`), built in the
# sandbox with the toolchain rust-toolchain.toml pins, on x86_64 and aarch64
# Linux -- the image's two architectures, so neither is first built at a
# release; and every system's outputs evaluated, nothing built, so a break on
# a system no runner here builds (Apple silicon) still shows. The inputs are
# flake.lock's.

on:
  # every push to main, whatever it touches, as python's: the flake's source is
  # the repository less its tooling, and the checks read more besides
  # (dist-workspace.toml, the hooks)
  push:
    branches: [main]
  # every pull request, whatever it touches: a path-filtered workflow never
  # reports, and a required check that never reports blocks the merge
  pull_request:
  workflow_dispatch:

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        # flakes on, and the job's token for GitHub fetches
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # the formatter's verdict (nixfmt, shfmt, just's own) as `nix fmt` gives it: --ci formats,
      # and fails if that changed a file, as the flake's `format` check fails
      - name: nix fmt (check)
        run: nix fmt -- --ci

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Every system, evaluated
        if: matrix.os == 'ubuntu-latest'
        run: nix flake check --no-build --all-systems
