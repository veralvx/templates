# A release tag (`just release`'s v<version>) publishes the library: to crates.io by
# publish-crates.yml, called here as dist's release.yml calls it for a binary -- this file is the
# one crates.io's Trusted Publishing names (it reads the calling workflow): publish-crates.yml says
# how -- then its GitHub release, titled and noted as dist's for a binary: the version's changelog
# heading, its link dropped, the section beneath as notes (release-notes.sh, from the tag's own
# commit), made in a job of their own that writes nothing but them (an artifact). Only the release
# job can write this repository, and it runs `gh` alone.
name: Publish

on:
  push:
    # a release's, not a pre-release's (v1.0.0-rc.1), which dist's publish job skips too
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  publish-crates:
    uses: ./.github/workflows/publish-crates.yml
    permissions:
      contents: read
      id-token: write

  # the repository's code (release-notes.sh) run where nothing can write: a job of its own, read
  # alone, its title, "Latest" and notes handed to the release job, which checks nothing out
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      title: ${{ steps.notes.outputs.title }}
      latest: ${{ steps.notes.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the tags: which release is the highest
          fetch-depth: 0

      - name: The title and the notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(.github/release-notes.sh CHANGELOG.md "$version")"
          # `## [1.2.3](<compare link>) - <date>`: dist's title (parse-changelog's, its link
          # dropped) is `1.2.3 - <date>`, its notes the section's body
          heading="${notes%%$'\n'*}"
          title="$(sed -E 's/^## //; s/^\[([^]]*)\]\([^)]*\)/\1/' <<< "$heading")"
          sed '1d; /./,$!d' <<< "$notes" > notes.md
          # GitHub's "Latest" is the highest release, never a patch to an older line
          highest="$(git tag --list 'v[0-9]*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)"
          latest=false
          if [[ $GITHUB_REF_NAME == "$highest" ]]; then latest=true; fi
          {
            echo "title=$title"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Keep the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [publish-crates, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: The notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.notes.outputs.title }}
          LATEST: ${{ needs.notes.outputs.latest }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --latest="$LATEST" --title "$TITLE" --notes-file notes.md
