version: 2

# Covers the cargo, github-actions and nix ecosystems (the last: flake.lock's
# nixpkgs and rust-overlay, monthly). These are version-pinned in this
# repository and are NOT updated here:
#   - the dprint plugin URLs in dprint.json: `just dprint-update`
{%- if project_kind != "lib" %}
#   - `cargo-dist-version` in dist-workspace.toml, and
#     .github/workflows/release.yml's actions (dist writes it, and its `dist
#     plan` refuses one that differs): the dev shell's dist, which the flake's
#     `pins` check holds -- `just pins-update` moves both (`dist init`)
{%- endif %}
#   - the toolchain's channel in rust-toolchain.toml, which tracks the MSRV
#     deliberately and should move only when you raise `rust-version` (a
#     `1.<minor>` channel takes rust-overlay's newest patch: the nix entry's)
updates:
  # ─── Rust (Cargo) ───────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # `build(deps): ...` -- a changelog entry (cliff.toml), so a release can
    # carry a dependency update; `chore` is left out of the changelog
    commit-message:
      prefix: "build"
      include: "scope"
    labels: # each created once (Issues > Labels): one the repository lacks is ignored
      - "dependencies"
      - "rust"
    groups:
      # Minor and patch updates are batched into a single PR.
      # Major updates are left ungrouped for individual review.
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
      semver-major-days: 7

  # ─── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
{%- if project_kind != "lib" %}
    # dist's, as said above (a path from the repository's root)
    exclude-paths:
      - ".github/workflows/release.yml"
{%- endif %}
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # `ci(deps): ...` -- nothing a user of the crate meets, so no changelog entry
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: # each created once (Issues > Labels): one the repository lacks is ignored
      - "dependencies"
      - "actions"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # ─── Nix (the flake's inputs) ───────────────────────────────────
  # monthly, in one pull request, each input to its branch's newest commit,
  # merged by a person (dependabot-automerge.yml takes patch and minor bumps
  # alone, and a commit's move is neither). The toolchain is the MSRV's: a
  # `1.<minor>` one moves to rust-overlay's newest patch of it, the miri
  # shell's nightly to its newest. A private repository's are not moved (the
  # `nix` ecosystem is public repositories' alone): `nix flake update` by hand
{%- if project_kind != "lib" %}
  # dist follows: once the dev shell's moved, the `pins` check fails, and
  # `just pins-update` on the branch moves cargo-dist-version and release.yml
  # to it
{%- endif %}
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
{%- if project_kind == "lib" %}
    # `chore(deps): ...` -- the flake is the dev shell and the checks: nothing
    # a user of the crate meets
    commit-message:
      prefix: "chore"
{%- else %}
    # `build(deps): ...` -- a changelog entry: `nix build` ships the binary
    # from the flake
    commit-message:
      prefix: "build"
{%- endif %}
      include: "scope"
    labels: # each created once (Issues > Labels): one the repository lacks is ignored
      - "dependencies"
      - "nix"
    groups:
      # every input, whatever its move: a commit has no semver level
      flake-inputs:
        patterns:
          - "*"
