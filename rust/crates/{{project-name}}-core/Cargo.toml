[package]
name = "{{project-name}}-core"
version.workspace = true
authors.workspace = true
{% assign cat_list = categories | split: "," -%}
categories = [{% for c in cat_list %}"{{ c | strip }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The library of {{project-name}}: {{description}}"

[dependencies]

[dev-dependencies]

[lints]
workspace = true

# The library is consumed as a dependency, not shipped as an artifact,
# so cargo-dist has nothing to build for it.
[package.metadata.dist]
dist = false
