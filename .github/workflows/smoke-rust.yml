name: Smoke (rust)

# The template proven the only way that counts: generated with the real
# cargo-generate, for every project_kind, and the result put through what its
# own CI and `just checks` run. Weekly as well, because a template rots
# without a commit: a new clippy lint, a new stable or nightly (the other
# tools are the template's lock's, moved by its lock update, but
# cargo-generate's floor).
#
#   combinations   all 24 kind x licence x email answers through the real
#                  cargo-generate, the floor (0.25.0; no email, no image): each
#                  manifest parses, each licence file is where its choice puts
#                  it, the image's workflow is there or not, dprint passes
#   generate       cargo-generate (the floor), the dev shell's tools at the
#                  lock's versions; its git hooks, installed, refuse an
#                  unformatted file, a bad message and a pushed revert; then
#                  the generated justfile's recipes (clippy on the pinned MSRV
#                  and on stable, Miri on nightly), dprint, cog, git-cliff and
#                  `cargo package`; for the workspace, two `just release`s
#                  against a bare remote
#   nix            generated by the lock's cargo-generate (nixpkgs'), the
#                  generated flake.nix: `nix fmt` and `nix flake check` (the
#                  image among its checks), `just fmt` changing nothing, `nix
#                  build`, `just pins-update` moving a stale cargo-dist-version
#                  back, and the image run in Docker
#
# Each generation answers from dev/rust/answers.toml, as `just generate`
# does; a `-d` -- the kind, an answer a step varies -- wins over it. Each runs
# with no network (dev/offline.sh), the floor's build and the lock's alike:
# generating needs none, and this holds it so.
#
# Called by smoke.yml, which decides when it runs and holds the
# concurrency: a called workflow runs in its caller's context. render-check
# runs in checks.yml.

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  combinations:
    name: Every answer combination
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      # the template's floor: every combination generated by the oldest cargo-generate it takes
      - name: Install cargo-generate
        run: dev/install-cargo-generate.sh

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # the template's lock's, as a generated project's dev shell has it
      - name: Install dprint
        run: dev/nix-tools.sh rust dprint

      - name: Generate and check each
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combinations"
          mkdir -p "$out"
          for kind in bin lib both workspace; do
            for licence in "MIT OR Apache-2.0" MIT Apache-2.0; do
              for email in jane@example.com ""; do
                name="c-$kind-$(tr -cd 'a-z0-9' <<< "${licence,,}")${email:+-e}"
                # the image: its default with the email, declined without (a lib is never asked)
                image=()
                if [ "$kind" != lib ] && [ -z "$email" ]; then image=(-d container_image=false); fi
                dev/offline.sh cargo-generate generate --path "$GITHUB_WORKSPACE" rust \
                  --name "$name" --destination "$out" --silent \
                  --values-file "$GITHUB_WORKSPACE/dev/rust/answers.toml" \
                  -d project_kind="$kind" "${image[@]}" -d "author_email=$email" \
                  -d "license=$licence"
                dir="$out/$name"
                want=absent
                if [ "$kind" != lib ] && [ -n "$email" ]; then want=present; fi
                for file in .github/workflows/image.yml .github/image-registries.sh; do
                  have=$([ -f "$dir/$file" ] && echo present || echo absent)
                  if [ "$have" != "$want" ]; then
                    echo "::error::$dir/$file is $have, expected $want" >&2
                    exit 1
                  fi
                done
                RUSTUP_TOOLCHAIN=stable cargo metadata --no-deps --format-version 1 \
                  --manifest-path "$dir/Cargo.toml" > /dev/null
                # each package's licence files: the root, and a workspace's members
                packages=("$dir")
                if [ "$kind" = workspace ]; then packages+=("$dir"/crates/*); fi
                for package in "${packages[@]}"; do
                  for file in MIT APACHE; do
                    case "$licence/$file" in
                      MIT/APACHE | Apache-2.0/MIT) want=absent ;;
                      *) want=present ;;
                    esac
                    have=$([ -f "$package/LICENSE-$file" ] && echo present || echo absent)
                    if [ "$have" != "$want" ]; then
                      echo "::error::$package/LICENSE-$file is $have, expected $want" >&2
                      exit 1
                    fi
                  done
                done
                (cd "$dir" && dprint check)
              done
            done
          done

      - name: A name that is no Rust crate name is refused
        run: |
          set -euo pipefail
          # no identifier, a keyword, a crate of Rust's own (validate-name.rhai); the
          # destination must exist, or cargo-generate fails before the hook runs
          mkdir -p "$RUNNER_TEMP/refused"
          for name in 3d-tool fn self std; do
            if dev/offline.sh cargo-generate generate --path "$GITHUB_WORKSPACE" rust \
              --name "$name" --destination "$RUNNER_TEMP/refused" --silent \
              --values-file "$GITHUB_WORKSPACE/dev/rust/answers.toml" \
              -d project_kind=bin -d author_email= -d license=MIT -d keywords=cli \
              -d container_image=false > "$RUNNER_TEMP/refused.log" 2>&1; then
              echo "::error::$name was not refused" >&2
              exit 1
            fi
            if ! grep -q 'choose another name' "$RUNNER_TEMP/refused.log"; then
              echo "::error::$name failed, but not by the hook:" >&2
              cat "$RUNNER_TEMP/refused.log" >&2
              exit 1
            fi
          done

  generate:
    name: Generate (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [bin, lib, both, workspace]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
          components: miri

      # Cargo's home only (the registry): a cached target/ restored into the
      # destination would make cargo-generate refuse it ("Target directory
      # already exists")
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: smoke-rust-${{ matrix.kind }}
          cache-targets: "false"

      - name: Install cargo-generate
        run: dev/install-cargo-generate.sh

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # the project's recipes outside its dev shell, with that shell's tools: the
      # template's lock's versions -- the hooks' just, dprint, shellcheck, shfmt,
      # actionlint and cog, `just test`'s and `just shell-check`'s jq, the
      # releases' git-cliff and dist, `just audit`'s cargo-audit
      - name: Install the tools
        run: >-
          dev/nix-tools.sh rust just dprint cocogitto git-cliff cargo-dist
          cargo-audit shellcheck shfmt actionlint jq

      - name: Generate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generated"
          dev/offline.sh cargo +stable generate --path "$GITHUB_WORKSPACE" rust \
            --name demo --destination "$RUNNER_TEMP/generated" --silent \
            --values-file "$GITHUB_WORKSPACE/dev/rust/answers.toml" \
            -d project_kind=${{ matrix.kind }}
          cd "$RUNNER_TEMP/generated/demo"
          # in git's config, not GIT_AUTHOR_NAME and the like: `cog verify` reads it there
          git config user.name smoke
          git config user.email smoke@example.com
          git add .
          git commit --quiet -m "chore: initial commit from template"

      # installed for every step below, so the releases commit and push
      # through them too
      - name: The git hooks refuse what CI would
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          just install-hooks
          refused() {
            if "$@"; then echo "::error::not refused: $*" >&2; exit 1; fi
          }
          # pre-commit: a source file rustfmt would change
          file="$(git ls-files '*.rs' | head -n 1)"
          printf '\nconst  UNFORMATTED: u8 = 0;\n' >> "$file"
          refused git commit --quiet -am "style: unformatted"
          git checkout -- "$file"
          # commit-msg: a message that is no Conventional Commit; and, with the identity in
          # the environment only, a refusal that says so rather than cog's panic
          refused git commit --quiet --allow-empty -m "not conventional"
          git config --unset user.email
          refused env GIT_AUTHOR_EMAIL=smoke@example.com GIT_COMMITTER_EMAIL=smoke@example.com \
            git commit --quiet --allow-empty -m "feat: no email in git's config" 2> refusal
          grep -q "^commit-msg: cog verify needs git's user.name and user.email" refusal
          rm refusal
          git config user.email smoke@example.com
          # pre-push: a revert, which git commits without running commit-msg
          git init --quiet --bare "$RUNNER_TEMP/hooks.git"
          echo probe > probe.txt
          git add probe.txt
          git commit --quiet -m "docs: a probe"
          git revert --no-edit HEAD
          refused git push --quiet "$RUNNER_TEMP/hooks.git" HEAD:main
          git reset --quiet --hard HEAD~2
          git push --quiet "$RUNNER_TEMP/hooks.git" HEAD:main

      - name: The justfile's checks (the pinned MSRV toolchain)
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          just --fmt --check --unstable
          just cargo-check test clippy fmt-check docs-check shell-check actionlint cog audit
          just miri

      - name: Clippy on stable (what CI runs; new lints land here first)
        working-directory: ${{ runner.temp }}/generated/demo
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: dprint, with the plugins dprint.json pins
        working-directory: ${{ runner.temp }}/generated/demo
        run: dprint check

      - name: The changelog, and the package crates.io would get
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          just changelog --unreleased
          cargo +stable package --workspace --locked

      # the recipe that commits, tags and pushes, against a bare remote, once
      # `dist init` has written release.yml (refused before); the tag's
      # workflow publishes, which a bare remote runs none of
      - name: Two releases (workspace)
        if: matrix.kind == 'workspace'
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          git init --quiet --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push --quiet origin main
          if out=$(just release minor 2>&1); then
            echo "::error::a release with no release.yml was not refused" >&2
            exit 1
          fi
          grep -q "no .github/workflows/release.yml" <<< "$out"
          dist init --yes
          just fmt
          # dist's release.yml, calling publish-crates.yml (its inputs, secrets and permissions
          # actionlint's), and its announce job waiting for it
          just actionlint
          grep -q '^    uses: ./.github/workflows/publish-crates.yml$' .github/workflows/release.yml
          grep -q '^      - custom-publish-crates$' .github/workflows/release.yml
          git add --all
          git commit --quiet -m "ci: dist init"
          git commit --quiet --allow-empty -m "feat(core): count things"
          git push --quiet origin main
          just release minor
          git commit --quiet --allow-empty -m "fix!: refuse zero"
          git push --quiet origin main
          just release minor
          test "$(git -C "$RUNNER_TEMP/origin.git" tag | tr '\n' ' ')" = "v0.1.0 v0.2.0 "
          grep -q '^version = "0.2.0"' Cargo.toml
          grep -q '^## \[0.2.0\](https://github.com/jane/demo/compare/v0.1.0..v0.2.0)' CHANGELOG.md
          if just release patch; then
            echo "::error::a release with nothing new was not refused" >&2
            exit 1
          fi
          # a commit CI never ran on, a release otherwise: refused until pushed
          git commit --quiet --allow-empty -m "fix: unpushed"
          if out=$(just release patch 2>&1); then
            echo "::error::a release of an unpushed main was not refused" >&2
            exit 1
          fi
          grep -q "main is not origin/main" <<< "$out"
          git reset --quiet --hard origin/main

  nix:
    name: Nix (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [bin, lib, both, workspace]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # the newest cargo-generate the template meets: its lock's (the floor
      # generates the other jobs' projects)
      - name: Install cargo-generate
        run: dev/nix-tools.sh rust cargo-generate

      - name: Generate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generated"
          dev/offline.sh cargo-generate generate --path "$GITHUB_WORKSPACE" rust \
            --name demo --destination "$RUNNER_TEMP/generated" --silent \
            --values-file "$GITHUB_WORKSPACE/dev/rust/answers.toml" \
            -d project_kind=${{ matrix.kind }}
          # nixpkgs builds cargo-generate without its `git` feature (buildNoDefaultFeatures),
          # so no repository is made; and a git flake sees tracked files only
          git -C "$RUNNER_TEMP/generated/demo" init --quiet
          git -C "$RUNNER_TEMP/generated/demo" add .

      - name: nix fmt, then nix flake check (every system evaluated, this one built)
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          nix fmt -- --ci
          nix flake check --no-build --all-systems
          nix flake check --print-build-logs

      # every formatter, `nix fmt` last, on what generation wrote: nothing to change
      - name: just fmt changes nothing
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          # nor the lock the template ships: no command before may have changed it
          nix develop --command just fmt
          git diff --exit-code

      - name: nix build
        if: matrix.kind != 'lib'
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          nix build --print-build-logs
          ./result/bin/demo

      # dist's first `dist init` (release.yml, the file in dist's own style) committed, as the first
      # steps (CONTRIBUTING.md) ask; then `just pins-update` idle, and with cargo-dist-version
      # planted stale: moved back to the shell's dist, release.yml regenerated as it was, nothing
      # else changed
      - name: just pins-update moves cargo-dist-version back
        if: matrix.kind != 'lib'
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          nix develop --command dist init --yes
          nix develop --command just fmt
          nix develop --command just actionlint
          git add --all
          git -c user.name=smoke -c user.email=smoke@example.com commit --quiet -m "ci: dist init"
          nix develop --command just pins-update
          sed -i 's/^cargo-dist-version = .*/cargo-dist-version = "0.1.0"/' dist-workspace.toml
          nix develop --command just pins-update
          git diff --exit-code
          test -z "$(git status --porcelain)"

      # built by `nix flake check` (the flake's `image` check); here loaded and run as a user would
      - name: The image runs
        if: matrix.kind != 'lib'
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          stream="$(nix build --no-link --print-out-paths .#image.stream)"
          "$stream" | docker load
          # the image's name and tag, as image.yml reads them: the project's, never a registry's
          image="$(nix eval --raw .#image.imageName):$(nix eval --raw .#image.imageTag)"
          test "$image" = demo:0.1.0
          case ${{ matrix.kind }} in
            both | workspace) expected="demo: 2 + 3 = 5" ;; # main.rs calls the library
            *) expected="Hello from demo!" ;;
          esac
          test "$(docker run --rm --pull never "$image")" = "$expected"
          test "$(docker inspect --format '{{ .Config.User }}' "$image")" = "65534:65534"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" \
            = "https://github.com/jane/demo"
