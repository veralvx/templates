# The dprint plugins -- every dprint.json's, the root's and each template's -- moved to their newest
# releases, and the root's Markdown and TOML formatted by them, as `just dprint-update` does
# (dev/dprint_plugins.py), proposed as a pull request on the branch dprint/plugins, which the next
# run rebuilds from the default branch -- unless it holds a person's commit (dev/propose.sh, as
# locks.yml's: GITHUB_TOKEN, the repository letting Actions create pull requests). Dependabot has no
# dprint ecosystem, and nixpkgs' plugins lag their releases: this keeps them current. Nothing
# moved, no pull request; a template's Markdown a new plugin formats apart is the pull request's
# smoke tests', its description says.
#
# Two jobs: `update` runs dprint and the plugins it fetches with a token that reads alone, and hands
# its change over as an artifact; `propose`, which may push and open pull requests, applies it with
# git and gh and runs nothing else -- and refuses a change to anything dev/dprint.files does not
# let through, read from its own checkout, or to more than tracked files' content.
name: dprint plugins

on:
  schedule:
    - cron: "0 6 1 * *" # monthly: the 1st, 06:00 UTC, after locks.yml's
  workflow_dispatch:

permissions: {}

# one run at a time: each rebuilds the branch the last one pushed
concurrency:
  group: dprint-plugins

jobs:
  update:
    name: The plugins, updated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # what `propose` reads first: `ok` only once the update is done, so a failed one is told from
      # a lost artifact
      - name: Begin
        run: |
          mkdir "$RUNNER_TEMP/plugins"
          echo failed > "$RUNNER_TEMP/plugins/status"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the pull request is against the branch the run is on: by hand, only the default one (a
      # schedule runs on it)
      - name: On the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: dev/on-default-branch.sh

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # the root lock's, the dev shell's
      - name: Install dprint and just
        run: dev/nix-tools.sh . dprint just

      - name: Update the plugins, and format what follows them
        run: |
          set -euo pipefail
          just dprint-update --summary "$RUNNER_TEMP/plugins/summary.md"
          # the change, for `propose`: empty if nothing moved
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/plugins/changes.patch"
          echo ok > "$RUNNER_TEMP/plugins/status"

      - name: Hand it over
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: ${{ runner.temp }}/plugins/
          if-no-files-found: error
          retention-days: 7
          overwrite: true # a re-run's

  propose:
    name: The plugins, proposed
    needs: update
    # the update's own verdict, read from its status: a failed one leaves nothing to propose
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the branch
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins
          path: ${{ runner.temp }}/plugins

      # dev/propose.sh, from this checkout: the change applied, held to dev/dprint.files (its own
      # copy), proposed on dprint/plugins; the commit's scopes (AGENTS.md's) every template root's
      # and dev's, and shared's when its originals were formatted, which propose.sh adds
      - name: Propose it
        env:
          BOT: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scope="$(printf '%s\n' */cargo-generate.toml | sed 's|/.*||' | paste --serial --delimiters=,),dev"
          dev/propose.sh "$RUNNER_TEMP/plugins" dev/dprint.files dprint/plugins "build($scope): update the dprint plugins"
