# What `just checks` runs but the flake's (nix.yml) and the commits' and dprint's (style-check-*):
# the format, the lints (tinymist), the shell (shellcheck, shfmt), the workflows (actionlint), the
# tests, the imports' versions, the README's examples, a template package's template as initialized,
# and the bundle linted as typst/packages lints it; and the README and that template again on the
# oldest Typst typst.toml declares (`compiler`). The tools are the flake's, at the versions
# flake.lock locks (.github/install-tools.sh), so `nix develop` and CI judge alike.
name: Checks

on:
  push:
    branches: [main]
  # every pull request, whatever it touches: a path-filtered workflow never reports, and a
  # required check that never reports blocks the merge
  pull_request:
  workflow_dispatch:

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Install the flake's tools
        run: .github/install-tools.sh

      - name: The checks
        run: just format-check lint shell-check actionlint test versions-check readme-check template-check package-check

      # what tytanic compared, for a failing visual test: the reference, the output, the difference
      - name: Keep the tests' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests
          path: |
            tests/**/ref/
            tests/**/out/
            tests/**/diff/
          if-no-files-found: ignore
          retention-days: 7

      # the directory typst/packages would get, to look at: the thumbnail of a template among it
      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/
          # a template's dotfiles too (template/.gitignore): upload-artifact leaves them out by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  floor:
    name: The oldest Typst (typst.toml's compiler)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read typst.toml
        id: manifest
        run: sed -n 's/^compiler = "\([^"]*\)".*/compiler=\1/p' typst.toml >> "$GITHUB_OUTPUT"

      # as typst-<version>, the name `just floor` runs; first, so the flake's tools, added to PATH
      # after it, hold the `typst` named so
      - name: Install the oldest Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ steps.manifest.outputs.compiler }}
          executable-name: typst-${{ steps.manifest.outputs.compiler }}

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # `just floor` reads typst.toml with the flake's Typst (`typst eval`), which renders the
      # bundle's thumbnail too
      - name: Install the flake's tools
        run: .github/install-tools.sh

      - name: The README and the template on the oldest Typst
        run: just floor
