# git-cliff: CHANGELOG.md from the Conventional Commits, written by `just release` (never by
# hand). Grouped by commit type, breaking changes first; what changes nothing a user meets
# (chores, CI, formatting, the release commit itself) is left out.
#
# It names no project: `just changelog` passes the repository the headings' compare links need
# (`--github-repo`) and, for a workspace's package, its folder and tags. Run bare, the headings
# carry no link.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file, generated by
[git-cliff](https://git-cliff.org) from its commits; versions follow
[Semantic Versioning](https://semver.org).\n
"""
# a heading's version alone: of `v1.2.3`, or of a workspace package's `name-v1.2.3`, past
# its last `-v` (a member `v8`'s `v8-v1.0.0` is 1.0.0, `foo-v2`'s `foo-v2-v1.0.0` too: a name
# holds no `.`, uv's versions no `-`)
body = """
{% set url = "" -%}
{% if remote.github.owner -%}
    {% set url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% endif -%}
{% if version -%}
    {% if version is matching("^v[0-9]+(\\.|$)") -%}
        {% set number = version | trim_start_matches(pat="v") -%}
    {% else -%}
        {% set number = version | split(pat="-v") | last -%}
    {% endif -%}
    ## {% if url %}[{{ number }}]({{ url }}/\
        {%- if previous.version %}compare/{{ previous.version }}..{{ version }}\
        {%- else %}tree/{{ version }}{% endif %})\
    {%- else %}{{ number }}{% endif %} - \
    {{ timestamp | date(format="%Y-%m-%d") }}
{% elif url and previous.version -%}
    ## [Unreleased]({{ url }}/compare/{{ previous.version }}..HEAD)
{% else -%}
    ## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}{{ commit.scope }}: {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# what cog lets through unconventional -- merges, fixups (cog.toml) -- skipped below
filter_unconventional = false
protect_breaking_commits = true # a breaking change is listed whatever its type, first
# by type, the HTML comments ordering the groups
commit_parsers = [
    { message = "^(Merge |fixup! |squash! |amend! )", skip = true },
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
    { message = "^(chore|ci|style)", skip = true },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Refactoring" },
    { message = "^build", group = "<!-- 5 -->Build" },
    { message = "^doc", group = "<!-- 6 -->Documentation" },
    { message = "^test", group = "<!-- 7 -->Tests" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", group = "<!-- 9 -->Other" },
]
sort_commits = "oldest"
# the release tags, `v0.1.0` on, the first included (python's recipes pass their own pattern: a
# workspace's packages are tagged `name-v0.1.0`)
tag_pattern = "^v[0-9]"

[bump]
# what a bare `git cliff --bump` answers with no tag yet; the release recipes set the first
# release themselves
initial_tag = "v0.1.0"
